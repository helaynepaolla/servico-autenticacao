# Porta da Aplicacao
server.port=8081
spring.application.name=servico-autenticacao

# Conexao PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/servico_autenticacao
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configurações do JWT
jwt.secret=UmaChaveSecretaMuitoLongaParaGarantirASegurancaDoTokenJWTComMaisDe32Caracteres
jwt.expiracao=86400000
jwt.expiracao-segundos=86400

# Registro no Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


